<div class="qty">
  <button class="qty__btn" type="button" aria-label="Убрать одну упаковку" data-qty-dec>
    <svg width="16" height="16" aria-hidden="true"><use href="#i-minus"/></svg>
  </button>
  <span class="qty__value" data-qty-value>1</span>
  <span class="visually-hidden">шт. в корзине</span>
  <button class="qty__btn" type="button" aria-label="Добавить ещё одну упаковку" data-qty-inc>
    <svg width="16" height="16" aria-hidden="true"><use href="#i-plus"/></svg>
  </button>
</div>
